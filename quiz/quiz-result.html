    </div>

  <!-- Global App Script -->
  <script src="../script.js"></script>

  <!-- 3D Sacred Particle Canvas Script -->
  <script>
  (function () {
    const canvas = document.getElementById("canvas3D");
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let w = canvas.width = window.innerWidth;
    let h = canvas.height = window.innerHeight;

    window.addEventListener("resize", () => {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    });

    const particleCount = window.innerWidth < 768 ? 30 : 60;
    const particles = [];
    const colors = ["#ffd166", "#ff9f1c", "#ffeaa7", "#d4af37"];

    for (let i = 0; i < particleCount; i++) {
      particles.push({
        x: (Math.random() - 0.5) * w * 1.5,
        y: (Math.random() - 0.5) * h * 1.5,
        z: Math.random() * 800 + 100,
        radius: Math.random() * 2.2 + 1.2,
        color: colors[Math.floor(Math.random() * colors.length)],
        vy: -(Math.random() * 0.4 + 0.2)
      });
    }

    const fov = 380;
    function render() {
      ctx.clearRect(0, 0, w, h);
      const cx = w / 2;
      const cy = h / 2;

      particles.forEach(p => {
        p.y += p.vy;
        if (p.y < -h * 0.8) p.y = h * 0.8;
        const rz = p.z + 500;
        if (rz > 50) {
          const scale = fov / rz;
          const sx = cx + p.x * scale;
          const sy = cy + p.y * scale;
          const alpha = Math.max(0.1, Math.min(0.7, scale * 1.2));
          ctx.beginPath();
          ctx.arc(sx, sy, p.radius * scale * 1.6, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = alpha;
          ctx.fill();
        }
      });
      requestAnimationFrame(render);
    }
    render();
  })();
  </script>

  <!-- Confetti Celebration Script -->
  <script>
  (function () {
    const canvas = document.getElementById("confettiCanvas");
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let w = canvas.width = window.innerWidth;
    let h = canvas.height = window.innerHeight;

    window.addEventListener("resize", () => {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    });

    const confettiPieces = [];
    const colors = ["#ffd166", "#ff9f1c", "#2ecc71", "#e74c3c", "#f39c12", "#ffeaa7"];

    for (let i = 0; i < 70; i++) {
      confettiPieces.push({
        x: Math.random() * w,
        y: Math.random() * -h * 0.5,
        size: Math.random() * 7 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        vy: Math.random() * 2.5 + 1.8,
        vx: (Math.random() - 0.5) * 2,
        rotation: Math.random() * 360,
        vr: (Math.random() - 0.5) * 8
      });
    }

    let frame = 0;
    function renderConfetti() {
      if (frame > 220) {
        ctx.clearRect(0, 0, w, h);
        return;
      }
      ctx.clearRect(0, 0, w, h);
      confettiPieces.forEach(p => {
        p.y += p.vy;
        p.x += p.vx;
        p.rotation += p.vr;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        ctx.restore();
      });
      frame++;
      requestAnimationFrame(renderConfetti);
    }
    renderConfetti();
  })();
  </script>

  <!-- Quiz Result Logic Module -->
  <script type="module" src="quiz-result.js"></script>

  <!-- Theme Background Loader -->
  <script type="module">
    import { db } from "../firebase-config.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

    async function loadQuizBackground() {
      try {
        let data = null;
        const themeSnap = await getDoc(doc(db, "settings", "theme"));
        if (themeSnap.exists()) data = themeSnap.data();
        if (!data) {
          const bgSnap = await getDoc(doc(db, "settings", "backgrounds"));
          if (bgSnap.exists()) data = bgSnap.data();
        }
        if (!data) return;

        const bg = document.querySelector(".quiz-bg");
        if (!bg) return;

        const res = window.SanniveshamTheme
          ? window.SanniveshamTheme.resolveBackground(data, "quiz")
          : { chosen: (window.innerWidth <= 700 ? data.quizMobile : data.quizPc) || data.quizPc };

        if (res && res.chosen) {
          bg.style.backgroundImage = `linear-gradient(rgba(10,5,0,0.78), rgba(10,5,0,0.85)), url("${res.chosen}")`;
        }
      } catch (err) {
        console.warn("Quiz bg load error:", err);
      }
    }

    loadQuizBackground();
    window.addEventListener("sannivesham_theme_changed", loadQuizBackground);

    // Theme toggle modal logic
    const themeBtn = document.getElementById("themeToggleBtn");
    const themeModal = document.getElementById("themeModal");
    const themeClose = document.getElementById("themeModalClose");
    const themeBackdrop = document.getElementById("themeModalBackdrop");

    if (themeBtn && themeModal) {
      themeBtn.addEventListener("click", () => {
        themeModal.style.display = "flex";
        if (window.SanniveshamTheme && typeof window.SanniveshamTheme.renderThemeList === "function") {
          window.SanniveshamTheme.renderThemeList();
        }
      });
    }

    function closeThemeModal() {
      if (themeModal) themeModal.style.display = "none";
    }

    if (themeClose) themeClose.addEventListener("click", closeThemeModal);
    if (themeBackdrop) themeBackdrop.addEventListener("click", closeThemeModal);
  </script>
</body>
