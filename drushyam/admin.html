<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — సన్నివేశం స్ట్రీమ్</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0a0a0f;--card:#111118;--gold:#f5a623;--gold2:#e8942a;--text:#fff;--text2:#b3b3b3;--border:rgba(255,255,255,0.08);}
    body{
      background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:20px;
    }
    .login-box{
      width:100%;max-width:380px;padding:40px 32px;
      background:var(--card);border:1px solid var(--border);border-radius:20px;
      text-align:center;
    }
    .login-logo{
      font-size:1.5rem;font-weight:800;margin-bottom:8px;
      background:linear-gradient(135deg,var(--gold),var(--gold2));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    }
    .login-sub{color:var(--text2);font-size:0.85rem;margin-bottom:28px;}
    input{
      width:100%;padding:14px 16px;margin-bottom:14px;
      border-radius:10px;border:1px solid var(--border);
      background:rgba(255,255,255,0.05);color:var(--text);
      font-size:0.95rem;font-family:'Inter',sans-serif;outline:none;
    }
    input:focus{border-color:var(--gold);}
    button{
      width:100%;padding:14px;margin-top:6px;
      border:none;border-radius:10px;
      background:linear-gradient(135deg,var(--gold),var(--gold2));
      color:#000;font-weight:700;font-size:0.95rem;cursor:pointer;
      font-family:'Inter',sans-serif;
    }
    #loginMsg{margin-top:14px;color:#ff6b6b;font-size:0.85rem;min-height:18px;}
  </style>
</head>
<body>

  <div class="login-box">
    <div class="login-logo">సన్నివేశం స్ట్రీమ్</div>
    <div class="login-sub">Admin Dashboard Login</div>

    <input type="email" id="adminEmail" placeholder="Email">
    <input type="password" id="adminPassword" placeholder="Password">
    <button id="adminLoginBtn">లాగిన్ చేయండి</button>

    <p id="loginMsg"></p>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import {
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
    import {
      doc, getDoc
    } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

    const MAX_FAILED_ATTEMPTS = 5;
    const LOCKOUT_DURATION_MS = 5 * 60 * 1000;
    const loginBtn = document.getElementById("adminLoginBtn");
    const msg = document.getElementById("loginMsg");

    function getLockoutState() {
      const lockedUntil = parseInt(localStorage.getItem("drushyam_admin_locked_until") || "0", 10);
      const failedAttempts = parseInt(localStorage.getItem("drushyam_admin_failed_attempts") || "0", 10);
      const now = Date.now();
      if (lockedUntil > now) {
        return { isLocked: true, remainingSec: Math.ceil((lockedUntil - now) / 1000) };
      }
      return { isLocked: false, remainingSec: 0, failedAttempts };
    }

    function recordFailedAttempt() {
      const current = parseInt(localStorage.getItem("drushyam_admin_failed_attempts") || "0", 10) + 1;
      localStorage.setItem("drushyam_admin_failed_attempts", current.toString());
      if (current >= MAX_FAILED_ATTEMPTS) {
        const lockUntil = Date.now() + LOCKOUT_DURATION_MS;
        localStorage.setItem("drushyam_admin_locked_until", lockUntil.toString());
        return { locked: true, remainingSec: Math.ceil(LOCKOUT_DURATION_MS / 1000) };
      }
      return { locked: false, remainingAttempts: MAX_FAILED_ATTEMPTS - current };
    }

    function resetLockoutState() {
      localStorage.removeItem("drushyam_admin_failed_attempts");
      localStorage.removeItem("drushyam_admin_locked_until");
    }

    function updateLockoutUI() {
      const state = getLockoutState();
      if (state.isLocked) {
        loginBtn.disabled = true;
        msg.textContent = `⏳ ఖాతా తాత్కాలికంగా లాక్ చేయబడింది. దయచేసి ${state.remainingSec} సెకన్ల తర్వాత ప్రయత్నించండి.`;
        setTimeout(updateLockoutUI, 1000);
        return true;
      }
      loginBtn.disabled = false;
      return false;
    }

    async function verifyAdminStatus(user) {
      if (!user) return false;
      try {
        const tokenResult = await user.getIdTokenResult(true);
        if (tokenResult?.claims?.admin === true) return true;
      } catch (e) {}

      if (user.email) {
        try {
          const adminSnap = await getDoc(doc(db, "settings", "admin"));
          if (adminSnap.exists()) {
            const data = adminSnap.data();
            if (Array.isArray(data.emails) && data.emails.includes(user.email)) return true;
            if (data.email && data.email === user.email) return true;
          }
        } catch (e) {}
      }
      return false;
    }

    updateLockoutUI();

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const isAdmin = await verifyAdminStatus(user);
        if (isAdmin) {
          resetLockoutState();
          window.location.href = "dashboard.html";
        }
      }
    });

    loginBtn.addEventListener("click", async () => {
      if (updateLockoutUI()) return;

      const email = document.getElementById("adminEmail").value.trim();
      const password = document.getElementById("adminPassword").value.trim();

      if (!email || !password) {
        msg.textContent = "Email మరియు Password నమోదు చేయండి";
        return;
      }

      msg.textContent = "⏳ తనిఖీ చేస్తోంది (Verifying credentials)...";
      loginBtn.disabled = true;

      try {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        const isAdmin = await verifyAdminStatus(cred.user);
        if (!isAdmin) {
          await signOut(auth);
          const attemptInfo = recordFailedAttempt();
          if (attemptInfo.locked) {
            updateLockoutUI();
          } else {
            msg.textContent = `❌ ఈ ఖాతాకు అడ్మిన్ అనుమతులు లేవు. మిగిలిన ప్రయత్నాలు: ${attemptInfo.remainingAttempts}`;
          }
          return;
        }
        resetLockoutState();
        msg.textContent = "✅ Login Successful";
        window.location.href = "dashboard.html";
      } catch (e) {
        const attemptInfo = recordFailedAttempt();
        if (attemptInfo.locked) {
          updateLockoutUI();
        } else {
          msg.textContent = `లాగిన్ విఫలమైంది — ${e.message} (మిగిలిన ప్రయత్నాలు: ${attemptInfo.remainingAttempts})`;
        }
      } finally {
        const state = getLockoutState();
        if (!state.isLocked) loginBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
