  <style>
    #loader {
      position: fixed !important;
      inset: 0 !important;
      background: radial-gradient(circle at center, #261206 0%, #120703 60%, #080301 100%) !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: center !important;
      align-items: center !important;
      z-index: 999999 !important;
      transition: opacity 0.45s ease, visibility 0.45s ease, transform 0.45s ease !important;
      will-change: opacity, transform !important;
    }
    #loader.loader-hidden {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
      transform: scale(1.04) !important;
    }
    .loader-mandala-container {
      position: relative !important;
      width: 160px !important;
      height: 160px !important;
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      margin-bottom: 18px !important;
    }
    .mandala-ring {
      position: absolute !important;
      border-radius: 50% !important;
      pointer-events: none !important;
    }
    .mandala-ring.outer-ring {
      inset: 0 !important;
      border: 2px dashed rgba(255, 209, 102, 0.45) !important;
      box-shadow: 0 0 24px rgba(255, 209, 102, 0.2), inset 0 0 20px rgba(255, 183, 3, 0.15) !important;
      animation: spinClockwise 16s linear infinite !important;
    }
    .mandala-ring.inner-ring {
      inset: 14px !important;
      border: 1.5px dotted rgba(255, 183, 3, 0.7) !important;
      box-shadow: 0 0 16px rgba(255, 183, 3, 0.25) !important;
      animation: spinCounter 10s linear infinite !important;
    }
    .loader-emblem-wrap {
      position: relative !important;
      width: 100px !important;
      height: 100px !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      z-index: 2 !important;
    }
    .loader-emblem {
      width: 86px !important;
      height: 86px !important;
      object-fit: contain !important;
      border-radius: 50% !important;
      filter: drop-shadow(0 0 16px rgba(255, 209, 102, 0.75)) !important;
      animation: divineAura 2.6s ease-in-out infinite !important;
    }
    .divine-diya {
      position: absolute !important;
      bottom: -14px !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      z-index: 3 !important;
    }
    .diya-flame {
      width: 14px !important;
      height: 22px !important;
      background: radial-gradient(ellipse at 50% 85%, #ffffff 0%, #fff275 25%, #ff9800 65%, rgba(255, 60, 0, 0.3) 90%) !important;
      border-radius: 50% 50% 20% 20% / 60% 60% 40% 40% !important;
      animation: flameFlicker 1.3s ease-in-out infinite alternate !important;
      box-shadow: 0 0 16px rgba(255, 209, 102, 0.95), 0 -4px 22px rgba(255, 152, 0, 0.8) !important;
    }
    .diya-base {
      width: 30px !important;
      height: 9px !important;
      background: linear-gradient(to bottom, #ffd166, #9c6812) !important;
      border-radius: 0 0 15px 15px !important;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6) !important;
      border-top: 1px solid rgba(255, 255, 255, 0.3) !important;
    }
    .loader-title {
      font-size: 2.2rem !important;
      font-weight: 800 !important;
      margin: 10px 0 6px !important;
      letter-spacing: 1px !important;
      background: linear-gradient(110deg, #d4af37 0%, #ffe484 30%, #ffffff 50%, #ffd166 70%, #d4af37 100%) !important;
      background-size: 200% auto !important;
      -webkit-background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
      animation: goldShine 3s linear infinite !important;
      text-align: center !important;
      line-height: 1.2 !important;
    }
    .loader-tagline {
      font-size: 0.95rem !important;
      color: rgba(255, 209, 102, 0.85) !important;
      font-weight: 600 !important;
      letter-spacing: 0.5px !important;
      margin: 0 0 18px !important;
      text-shadow: 0 0 14px rgba(255, 209, 102, 0.35) !important;
      animation: softPulse 2.4s ease-in-out infinite !important;
      text-align: center !important;
    }
    .loader-pearls {
      display: flex !important;
      gap: 8px !important;
      align-items: center !important;
      justify-content: center !important;
    }
    .loader-pearls span {
      width: 9px !important;
      height: 9px !important;
      border-radius: 50% !important;
      background: #ffd166 !important;
      box-shadow: 0 0 12px rgba(255, 209, 102, 0.85) !important;
      animation: pearlBounce 1.2s ease-in-out infinite !important;
    }
    .loader-pearls span:nth-child(1) { animation-delay: 0s !important; }
    .loader-pearls span:nth-child(2) { animation-delay: 0.2s !important; }
    .loader-pearls span:nth-child(3) { animation-delay: 0.4s !important; }
    @keyframes spinClockwise { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spinCounter { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes divineAura { 0%, 100% { transform: scale(1); filter: drop-shadow(0 0 14px rgba(255, 209, 102, 0.6)); } 50% { transform: scale(1.05); filter: drop-shadow(0 0 26px rgba(255, 209, 102, 0.95)); } }
    @keyframes flameFlicker { 0% { transform: scale(1) rotate(-1.5deg); opacity: 0.92; } 50% { transform: scale(1.08, 1.15) rotate(2deg); opacity: 1; } 100% { transform: scale(0.95, 0.97) rotate(-2deg); opacity: 0.94; } }
    @keyframes goldShine { to { background-position: 200% center; } }
    @keyframes softPulse { 0%, 100% { opacity: 0.75; } 50% { opacity: 1; } }
    @keyframes pearlBounce { 0%, 100% { transform: translateY(0); opacity: 0.4; } 50% { transform: translateY(-7px); opacity: 1; } }
  </style>

  <script>
    (function() {
      function dismiss() {
        var el = document.getElementById('loader');
        if (el && !el.dataset.dismissed) {
          el.dataset.dismissed = 'true';
          el.classList.add('loader-hidden');
          setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 450);
        }
      }
      if (document.readyState === 'complete') {
        setTimeout(dismiss, 250);
      } else {
        window.addEventListener('load', function() { setTimeout(dismiss, 250); });
        document.addEventListener('DOMContentLoaded', function() { setTimeout(dismiss, 400); });
      }
      setTimeout(dismiss, 700);
    })();
  </script>

  <script src="script.js?v=2"></script>
  <script type="module">
    import { db } from "./firebase-config.js";
    import {
      doc,
      getDoc,
      getDocFromServer
    } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
    async function loadStoriesBackground() {
      let snap;
      try {
        snap = await getDocFromServer(doc(db, "settings", "backgrounds"));
      } catch (e) {
        snap = await getDoc(doc(db, "settings", "backgrounds"));
      }
      if (!snap.exists()) return;
      const data = snap.data();
      const bg = document.querySelector(".stories-bg");
      if (!bg) return;
      if (window.innerWidth <= 700 && data.storiesMobile) {
        bg.style.backgroundImage =
          `linear-gradient(rgba(10,5,0,0.60),
        rgba(10,5,0,0.65)),
        url("${data.storiesMobile}")`;
      } else if (data.storiesPc) {
        bg.style.backgroundImage =
          `linear-gradient(rgba(10,5,0,0.65),
        rgba(10,5,0,0.70)),
        url("${data.storiesPc}")`;
      }
    }
    loadStoriesBackground();
  </script>
