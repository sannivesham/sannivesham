  <!-- CREATIVE DIVINE PRELOADER -->
  <div id="loader" class="creative-loader">
    <div class="loader-mandala-container">
      <div class="mandala-ring outer-ring"></div>
      <div class="mandala-ring inner-ring"></div>
      <div class="loader-emblem-wrap">
        <img src="../images/logo.png" class="loader-emblem" alt="Sannivesham Logo">
        <div class="divine-diya">
          <div class="diya-flame"></div>

        </div>
      </div>
    </div>
    <h1 class="loader-title">సన్నివేశం</h1>
    <p class="loader-tagline">✨ సంస్కృతి • సంప్రదాయం • సంభాషణ ✨</p>
    <div class="loader-pearls">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>
  <script>
    (function() {
      function dismiss() {
        var el = document.getElementById('loader');
        if (el && !el.dataset.dismissed) {
          el.dataset.dismissed = 'true';
          el.classList.add('loader-hidden');
          setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 450);
        }
      }
      if (document.readyState === 'complete') {
        setTimeout(dismiss, 250);
      } else {
        window.addEventListener('load', function() { setTimeout(dismiss, 250); });
        document.addEventListener('DOMContentLoaded', function() { setTimeout(dismiss, 400); });
      }
      setTimeout(dismiss, 700);
    })();
  </script>
