<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>కీర్తనలు - గ్రంథాలయం | సన్నివేశం</title>
  <meta name="description" content="దివ్య గ్రంథాలయంలోని కీర్తనలు సమాహారం — సన్నివేశం.">
  <script src="../../theme.js"></script>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../library.css">
  <style>
    .subcat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      margin: 24px 0 40px;
    }
    .subcategory-card {
      background: rgba(22, 10, 5, 0.85);
      border: 1px solid rgba(255, 209, 102, 0.25);
      border-radius: 18px;
      padding: 20px;
      text-decoration: none;
      transition: all 0.25s ease;
      display: block;
    }
    .subcategory-card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 209, 102, 0.6);
      box-shadow: 0 8px 24px rgba(255, 209, 102, 0.15);
    }
    .subcat-icon { font-size: 2rem; margin-bottom: 10px; }
    .subcat-title { color: #ffd166; font-size: 1.15rem; font-weight: 700; margin: 0 0 12px; }
    .subcat-cta { color: rgba(237, 227, 200, 0.7); font-size: 0.85rem; font-weight: 600; }
  </style>
</head>
<body class="library-body theme-night">
  <div class="library-bg"></div>

  <nav class="glass-navbar">
    <a href="../" class="reader-back-btn">← గ్రంథాలయ విభాగాలకు</a>
    <a href="../../">ప్రారంభం</a>
    <a href="../">గ్రంథాలయం</a>
  </nav>

  <main class="subcat-container" style="max-width:1100px;margin:20px auto;padding:0 16px;">
    <div class="library-title-box">
      <h1>🎵 కీర్తనలు</h1>
      <p class="library-subtitle">కీర్తనలు పవిత్ర సమాహారం (0 రచనలు)</p>
    </div>

    <div class="subcat-grid">
      <p style="text-align:center;grid-column:1/-1;color:#ffd166;padding:40px;">త్వరలో మరిన్ని రచనలు చేర్చబడతాయి.</p>
    </div>
  </main>

  <footer class="simple-footer">
    <p class="footer-quote">✨ మన సాహిత్యం మన సంస్కృతి యొక్క ప్రతిబింబం ✨</p>
    <p>© 2026 సన్నివేశం</p>
  </footer>
</body>
</html>
