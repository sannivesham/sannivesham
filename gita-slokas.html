  <script type="module">

    import { db } from "./firebase-config.js";

    import {
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

    async function loadSlokasBackground() {

      const snap =
      await getDoc(
        doc(db, "settings", "backgrounds")
      );

      if (!snap.exists()) return;

      const data = snap.data();

      const bg =
      document.querySelector(".slokas-bg");

      if (!bg) return;

      if (
        window.innerWidth <= 700 &&
        data.slokasMobile
      ) {

        bg.style.backgroundImage =
        `linear-gradient(
          rgba(10,5,0,0.60),
          rgba(10,5,0,0.65)
        ),
        url("${data.slokasMobile}")`;

      }

      else if (data.slokasPc) {

        bg.style.backgroundImage =
        `linear-gradient(
          rgba(10,5,0,0.65),
          rgba(10,5,0,0.70)
        ),
        url("${data.slokasPc}")`;

      }

    }

    loadSlokasBackground();

  </script>
