<head>

<link rel="icon" type="image/png" href="logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Ramabhadra&family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="signin.css">

</head>
<body>

<header class="site-header">

<a href="index.html" class="logo">
సన్నివేశం అక్షరం
<span class="logo-en">
Sannivesham Aksharam
</span>
</a>

<button class="nav-toggle" id="navToggle" type="button" aria-label="Toggle menu" aria-expanded="false" aria-controls="mainNav">
  <span></span><span></span><span></span>
</button>

<nav class="main-nav" id="mainNav">

<a href="dashboard.html">Roadmap</a>

<a href="translator.html">Translator</a>

<a href="dictionary.html">Dictionary</a>

<a href="signin.html" class="nav-cta active" id="authLink">
Sign In
</a>

</nav>

<div class="nav-overlay" id="navOverlay"></div>

</header>


<section class="signin-section">

<div class="signin-card">

<div class="signin-top">

<div class="signin-icon">
📚
</div>

<h1>
స్వాగతం
</h1>

<p>

Continue your Telugu learning journey.

</p>

</div>


<div class="input-group">

<label>Email</label>

<input
type="email"
id="email"
placeholder="Enter your email">

</div>


<div class="input-group">

<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter your password">

</div>


<button
class="primary-btn"
id="loginBtn">

Sign In

</button>


<button
class="secondary-btn"
id="signupBtn">

Create Account

</button>


<div class="divider">

<span>OR</span>

</div>


<button
class="google-btn"
id="googleBtn">

<img
src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">

Continue with Google

</button>


<button
class="forgot-btn"
id="forgotBtn">

Forgot Password?

</button>


<p id="message"></p>

</div>

</section>


<script type="module" src="main.js"></script>
<script type="module" src="signin.js"></script>

</body>
</html>
