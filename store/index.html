<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>విక్రయశాల (Store) - త్వరలో | సన్నివేశం (Sannivesham)</title>
  <meta name="description" content="సన్నివేశం విక్రయశాల — త్వరలో ప్రారంభమవుతుంది (Coming Soon).">
  <link rel="canonical" href="https://sannivesham.com/store/">

  <meta property="og:title" content="విక్రయశాల (Store) - త్వరలో | సన్నివేశం">
  <meta property="og:description" content="సన్నివేశం విక్రయశాల త్వరలో ప్రారంభమవుతుంది (Coming Soon).">
  <meta property="og:image" content="https://sannivesham.com/images/store.png">
  <meta property="og:url" content="https://sannivesham.com/store/">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Noto+Sans+Telugu:wght@400;600;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      font-family: 'Noto Sans Telugu', 'Poppins', sans-serif;
      background: #0d0703;
      color: #EDE3C8;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 40px 20px;
      text-align: center;
      background: radial-gradient(circle at 50% 35%, #241206 0%, #120803 55%, #080402 100%);
    }

    /* Background Divine Ambient Canvas */
    #sparksCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Ambient Pulsing Glow Rings in Background */
    .ambient-pulse-ring {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 480px;
      height: 480px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 209, 102, 0.12) 0%, rgba(224, 86, 36, 0.05) 50%, transparent 70%);
      animation: pulse-ring 4s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes pulse-ring {
      0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.5; }
      100% { transform: translate(-50%, -50%) scale(1.18); opacity: 0.9; }
    }

    /* Top Brand Navigation */
    .brand-nav {
      position: fixed;
      top: max(calc(env(safe-area-inset-top, 0px) + 26px), 28px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 22px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 209, 102, 0.25);
      border-radius: 999px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 10;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .brand-nav:hover {
      background: rgba(255, 209, 102, 0.15);
      border-color: #ffd166;
      transform: translateX(-50%) scale(1.03);
    }

    .brand-logo {
      width: 26px;
      height: 26px;
      object-fit: contain;
    }

    .brand-title {
      color: #ffd166;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 1px;
    }

    /* Central Glassmorphism Card Container */
    .coming-soon-card {
      position: relative;
      z-index: 5;
      max-width: 680px;
      width: 100%;
      background: rgba(20, 10, 4, 0.75);
      border: 1px solid rgba(255, 209, 102, 0.35);
      border-radius: 32px;
      padding: 48px 28px 40px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 35px rgba(255, 209, 102, 0.12);
      animation: card-appear 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      margin-top: 30px;
    }

    @keyframes card-appear {
      from { opacity: 0; transform: translateY(24px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ══════════════════════════════════════════
       DIVINE DIYA WITH FLICKERING FLAME & SMOKE
    ══════════════════════════════════════════ */
    .diya-container {
      position: relative;
      width: 130px;
      height: 150px;
      margin: 0 auto 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    .diya-glow {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 100px;
      background: radial-gradient(circle, rgba(255, 190, 80, 0.45) 0%, transparent 70%);
      animation: glow-pulse 1.8s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes glow-pulse {
      0%, 100% { opacity: 0.6; transform: translateX(-50%) scale(0.95); }
      50% { opacity: 1; transform: translateX(-50%) scale(1.2); }
    }

    .smoke {
      position: absolute;
      top: 10px;
      left: 50%;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(240, 230, 210, 0.35);
      animation: smoke-rise 3.2s ease-in infinite;
      pointer-events: none;
    }

    .smoke:nth-child(1) { animation-delay: 0s; margin-left: -5px; }
    .smoke:nth-child(2) { animation-delay: 1.1s; margin-left: 3px; }
    .smoke:nth-child(3) { animation-delay: 2.2s; margin-left: -2px; }

    @keyframes smoke-rise {
      0% { transform: translate(0, 0) scale(1); opacity: 0; }
      15% { opacity: 0.45; }
      100% { transform: translate(16px, -90px) scale(2.4); opacity: 0; }
    }

    .diya-flame {
      position: absolute;
      top: 42px;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 44px;
      background: radial-gradient(circle at 50% 75%, #ffffff 0%, #fff2a8 25%, #ffd166 50%, #ff8822 75%, transparent 85%);
      border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
      filter: drop-shadow(0 0 10px rgba(255, 180, 50, 0.9));
      animation: flame-flicker 1.5s ease-in-out infinite;
      transform-origin: bottom center;
    }

    @keyframes flame-flicker {
      0%, 100% { transform: translateX(-50%) scaleY(1) rotate(-1deg); }
      25% { transform: translateX(-50%) scaleY(1.1) rotate(1.5deg); }
      50% { transform: translateX(-50%) scaleY(0.95) rotate(-2deg); }
      75% { transform: translateX(-50%) scaleY(1.06) rotate(1deg); }
    }

    .diya-base {
      position: relative;
      width: 110px;
      height: 42px;
      background: linear-gradient(180deg, #D4AF37 0%, #AA8022 60%, #6E4F10 100%);
      border-radius: 0 0 55px 55px / 0 0 38px 38px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), inset 0 2px 4px rgba(255, 255, 255, 0.3);
    }

    .diya-base::before {
      content: "";
      position: absolute;
      top: -6px;
      left: 6px;
      right: 6px;
      height: 14px;
      background: linear-gradient(180deg, #F5D77F 0%, #D4AF37 100%);
      border-radius: 50%;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.4);
    }

    /* Badges & Typography */
    .store-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 209, 102, 0.12);
      border: 1px solid rgba(255, 209, 102, 0.4);
      color: #ffd166;
      font-size: 0.88rem;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 999px;
      margin-bottom: 18px;
      letter-spacing: 0.5px;
    }

    .main-heading {
      font-size: 2.2rem;
      font-weight: 800;
      color: #ffd166;
      line-height: 1.35;
      margin-bottom: 8px;
      text-shadow: 0 2px 14px rgba(255, 209, 102, 0.25);
    }

    .sub-heading-en {
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      color: #C9A24B;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 20px;
      opacity: 0.95;
    }

    .divider-line {
      width: 80px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ffd166, transparent);
      margin: 0 auto 22px;
    }

    .message-text {
      font-size: 1.05rem;
      color: #EDE3C8;
      line-height: 1.8;
      max-width: 520px;
      margin: 0 auto 28px;
      opacity: 0.9;
    }

    /* Status Pill */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 22px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px dashed rgba(255, 209, 102, 0.4);
      border-radius: 999px;
      color: #ffd166;
      font-size: 0.92rem;
      font-weight: 600;
      margin-bottom: 30px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ffd166;
      box-shadow: 0 0 10px #ffd166;
      animation: pulse-dot 1.5s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.75); }
    }

    /* Back to Home CTA Button */
    .btn-back-home {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #ffd166 0%, #e05624 100%);
      color: #120703;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      padding: 13px 28px;
      border-radius: 30px;
      box-shadow: 0 8px 24px rgba(255, 209, 102, 0.28);
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .btn-back-home:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 12px 30px rgba(255, 209, 102, 0.42);
      color: #000;
    }

    .btn-back-home .arrow {
      font-size: 1.15rem;
      transition: transform 0.3s ease;
    }

    .btn-back-home:hover .arrow {
      transform: translateX(-4px);
    }

    /* Responsive adjustments */
    @media (max-width: 600px) {
      body { padding: 30px 16px; }
      .coming-soon-card {
        padding: 38px 20px 32px;
        border-radius: 24px;
      }
      .main-heading { font-size: 1.75rem; }
      .sub-heading-en { font-size: 1rem; letter-spacing: 2px; }
      .message-text { font-size: 0.95rem; line-height: 1.7; }
      .btn-back-home { font-size: 0.92rem; padding: 12px 24px; }
      .ambient-pulse-ring { width: 320px; height: 320px; }
    }
  </style>
</head>
<body>

  <!-- Floating Golden Sparks Canvas -->
  <canvas id="sparksCanvas"></canvas>

  <!-- Ambient Light Pulse -->
  <div class="ambient-pulse-ring"></div>

  <!-- Top Navbar Link -->
  <a href="/#categories" class="brand-nav" aria-label="Go to Sannivesham Home">
    <img src="../images/logo.png" alt="Sannivesham Logo" class="brand-logo" onerror="this.src='/images/logo.png'">
    <span class="brand-title">సన్నివేశం</span>
  </a>

  <!-- Main Animated Coming Soon Card -->
  <main class="coming-soon-card">
    
    <!-- Animated Diya -->
    <div class="diya-container">
      <div class="diya-glow"></div>
      <span class="smoke"></span>
      <span class="smoke"></span>
      <span class="smoke"></span>
      <div class="diya-flame"></div>
      <div class="diya-base"></div>
    </div>

    <!-- Badge -->
    <div class="store-badge">
      <span>🛍️ సన్నివేశం విక్రయశాల</span>
    </div>

    <!-- Title -->
    <h1 class="main-heading">త్వరలో ప్రారంభమవుతుంది</h1>
    <div class="sub-heading-en">Coming Soon</div>
    
    <div class="divider-line"></div>

    <!-- Message -->
    <p class="message-text">
      సనాతన సంస్కృతి మరియు సంప్రదాయ ఆధ్యాత్మిక పరిమళాలతో సన్నివేశం విక్రయశాల త్వరలోనే మీ ముందుకు రానుంది.
    </p>

    <!-- Status -->
    <div class="status-pill">
      <span class="status-dot"></span>
      <span>రూపకల్పన జరుగుతోంది • Under Construction</span>
    </div>

    <div>
      <a href="/#categories" class="btn-back-home">
        <span class="arrow">←</span>
        <span>హోమ్ పేజీకి తిరిగి వెళ్ళండి</span>
      </a>
    </div>

  </main>

  <!-- Interactive Golden Particle Dust Script -->
  <script>
    (function() {
      const canvas = document.getElementById("sparksCanvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");

      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener("resize", () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const particleCount = 45;
      const particles = [];

      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 2 + 0.8,
          speedY: -(Math.random() * 0.4 + 0.15),
          speedX: (Math.random() - 0.5) * 0.3,
          opacity: Math.random() * 0.6 + 0.2,
          maxOpacity: Math.random() * 0.7 + 0.3,
          fadeSpeed: Math.random() * 0.01 + 0.005,
          color: Math.random() > 0.4 ? "#ffd166" : "#ff9a3c"
        });
      }

      function render() {
        ctx.clearRect(0, 0, width, height);

        for (let i = 0; i < particleCount; i++) {
          const p = particles[i];
          p.y += p.speedY;
          p.x += p.speedX;

          p.opacity += p.fadeSpeed;
          if (p.opacity >= p.maxOpacity || p.opacity <= 0.1) {
            p.fadeSpeed = -p.fadeSpeed;
          }

          if (p.y < -10) {
            p.y = height + 10;
            p.x = Math.random() * width;
          }
          if (p.x < -10) p.x = width + 10;
          if (p.x > width + 10) p.x = -10;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = Math.max(0, Math.min(1, p.opacity));
          ctx.shadowBlur = 6;
          ctx.shadowColor = p.color;
          ctx.fill();
        }

        requestAnimationFrame(render);
      }

      requestAnimationFrame(render);
    })();
  </script>

</body>
</html>
