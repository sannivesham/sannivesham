  <script>
    (function() {
      function dismiss() {
        var el = document.getElementById('loader');
        if (el && !el.dataset.dismissed) {
          el.dataset.dismissed = 'true';
          el.classList.add('loader-hidden');
          setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 450);
        }
      }
      if (document.readyState === 'complete') {
        setTimeout(dismiss, 250);
      } else {
        window.addEventListener('load', function() { setTimeout(dismiss, 250); });
        document.addEventListener('DOMContentLoaded', function() { setTimeout(dismiss, 400); });
      }
      setTimeout(dismiss, 700);
    })();
  </script>

    <script type="module">
        import { db } from "./firebase-config.js";

        import {
            doc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

        async function loadFestivalsBackground() {
            const snap = await getDoc(doc(db, "settings", "backgrounds"));
            if (!snap.exists()) return;

            const data = snap.data();
            const bg = document.querySelector(".festivals-bg");

            if (window.innerWidth <= 700 && data.festivalsMobile) {
                bg.style.backgroundImage =
                    `linear-gradient(rgba(15,8,3,0.50), rgba(15,8,3,0.50)), url("${data.festivalsMobile}")`;
            } else if (data.festivalsPc) {
                bg.style.backgroundImage =
                    `linear-gradient(rgba(15,8,3,0.60), rgba(15,8,3,0.60)), url("${data.festivalsPc}")`;
            }
        }

        loadFestivalsBackground();
    </script>
