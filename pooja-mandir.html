<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>పండుగల కౌంట్‌డౌన్ | సన్నివేశం</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Telugu:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Noto Serif Telugu", serif;

            background:
                radial-gradient(
                    circle at 50% 10%,
                    rgba(190, 143, 59, 0.15),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #120d09,
                    #21150d 50%,
                    #0d0906
                );

            color: #f8ead0;
            padding: 50px 20px;
        }

        .container {
            width: 100%;
            max-width: 1050px;
            margin: auto;
        }

        /* HEADER */

        .header {
            text-align: center;
            margin-bottom: 45px;
        }

        .brand {
            font-size: clamp(40px, 7vw, 70px);
            font-weight: 800;
            color: #e8c878;
            letter-spacing: 3px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #c8b493;
            font-size: 17px;
            letter-spacing: 1px;
        }

        .gold-line {
            width: 90px;
            height: 2px;
            background: #cda957;
            margin: 20px auto 0;
            opacity: 0.7;
        }

        /* TITLE */

        .section-title {
            text-align: center;
            font-size: clamp(25px, 4vw, 36px);
            color: #fff0cf;
            margin-bottom: 35px;
        }

        /* FESTIVAL LIST */

        .festival-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* FESTIVAL CARD */

        .festival-card {
            display: grid;

            grid-template-columns:
                1fr
                auto;

            gap: 25px;

            align-items: center;

            padding: 25px 28px;

            background: rgba(35, 24, 16, 0.78);

            border: 1px solid rgba(221, 181, 102, 0.22);

            border-radius: 20px;

            backdrop-filter: blur(12px);

            box-shadow:
                0 12px 35px rgba(0,0,0,0.25);

            transition: all 0.3s ease;
        }

        .festival-card:hover {
            transform: translateY(-3px);

            border-color:
                rgba(221, 181, 102, 0.5);

            box-shadow:
                0 15px 45px rgba(0,0,0,0.35);
        }

        /* FESTIVAL INFORMATION */

        .festival-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .festival-icon {
            width: 58px;
            height: 58px;

            min-width: 58px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 27px;

            background:
                rgba(221, 181, 102, 0.08);

            border:
                1px solid rgba(221, 181, 102, 0.3);
        }

        .festival-name {
            font-size: 22px;
            font-weight: 700;
            color: #f5ddb0;
            margin-bottom: 4px;
        }

        .festival-date {
            color: #ad9b7f;
            font-size: 14px;
        }

        /* COUNTDOWN */

        .countdown {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .time-box {
            min-width: 55px;

            padding: 10px 7px;

            text-align: center;

            border-radius: 11px;

            background:
                rgba(255, 239, 203, 0.045);

            border:
                1px solid rgba(222, 185, 105, 0.15);
        }

        .number {
            font-family: Arial, sans-serif;

            font-size: 22px;

            font-weight: 700;

            color: #e9c873;

            line-height: 1;
        }

        .label {
            margin-top: 5px;

            font-size: 10px;

            color: #a99a82;
        }

        /* TODAY */

        .today {
            padding: 15px 22px;

            border-radius: 12px;

            background:
                rgba(211, 169, 83, 0.12);

            border:
                1px solid rgba(221, 181, 102, 0.4);

            color: #f0ce7d;

            font-weight: 700;

            font-size: 17px;

            white-space: nowrap;
        }

        /* EMPTY */

        .empty {
            text-align: center;

            padding: 40px;

            color: #a99a82;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            body {
                padding: 30px 14px;
            }

            .festival-card {

                grid-template-columns: 1fr;

                gap: 20px;

                padding: 22px 18px;
            }

            .festival-info {
                gap: 14px;
            }

            .festival-icon {
                width: 50px;
                height: 50px;
                min-width: 50px;
                font-size: 23px;
            }

            .festival-name {
                font-size: 19px;
            }

            .countdown {
                width: 100%;
                justify-content: center;
            }

            .time-box {
                flex: 1;
                max-width: 75px;
            }

            .today {
                text-align: center;
                width: 100%;
            }
        }

        @media (max-width: 380px) {

            .time-box {
                min-width: 0;
                padding: 9px 4px;
            }

            .number {
                font-size: 18px;
            }

            .label {
                font-size: 9px;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <header class="header">

        <div class="brand">
            సన్నివేశం
        </div>

        <div class="subtitle">
            మన పండుగలు • మన సంస్కృతి • మన సంప్రదాయం
        </div>

        <div class="gold-line"></div>

    </header>


    <h1 class="section-title">
        🪔 రాబోయే పండుగలు
    </h1>


    <div id="festivalList" class="festival-list"></div>

</div>


<script>

    /*
    ==========================================
    FESTIVAL DATA
    ==========================================

    Date format:
    YYYY-MM-DD

    Time:
    00:00 IST

    Add more festivals here later.
    */

    const festivals = [

        {
            name: "వరలక్ష్మీ వ్రతం",
            date: "2026-07-31",
            icon: "🪷"
        },

        {
            name: "రక్షా బంధన్",
            date: "2026-08-28",
            icon: "🪢"
        },

        {
            name: "శ్రీకృష్ణ జన్మాష్టమి",
            date: "2026-09-04",
            icon: "🦚"
        },

        {
            name: "వినాయక చవితి",
            date: "2026-09-14",
            icon: "🐘"
        },

        {
            name: "నవరాత్రులు ప్రారంభం",
            date: "2026-10-11",
            icon: "🌺"
        },

        {
            name: "దసరా",
            date: "2026-10-20",
            icon: "🏹"
        },

        {
            name: "దీపావళి",
            date: "2026-11-08",
            icon: "🪔"
        },

        {
            name: "కార్తీక పౌర్ణమి",
            date: "2026-11-24",
            icon: "🌕"
        },

        {
            name: "ధనుర్మాసం ప్రారంభం",
            date: "2026-12-16",
            icon: "🙏"
        },

        {
            name: "వైకుంఠ ఏకాదశి",
            date: "2026-12-20",
            icon: "🛕"
        }

    ];


    /*
    ==========================================
    CREATE FESTIVAL CARD
    ==========================================
    */

    function createFestivalCard(festival, difference) {

        const card = document.createElement("div");

        card.className = "festival-card";

        card.dataset.date = festival.date;


        const left = document.createElement("div");

        left.className = "festival-info";


        left.innerHTML = `

            <div class="festival-icon">
                ${festival.icon}
            </div>

            <div>

                <div class="festival-name">
                    ${festival.name}
                </div>

                <div class="festival-date">
                    ${formatDate(festival.date)}
                </div>

            </div>

        `;


        const right = document.createElement("div");

        right.className = "countdown";


        if (difference <= 0) {

            right.innerHTML = `

                <div class="today">
                    🎉 ఈరోజు పండుగ
                </div>

            `;

        } else {

            const days =
                Math.floor(
                    difference /
                    (1000 * 60 * 60 * 24)
                );

            const hours =
                Math.floor(
                    (difference %
                    (1000 * 60 * 60 * 24)) /
                    (1000 * 60 * 60)
                );

            const minutes =
                Math.floor(
                    (difference %
                    (1000 * 60 * 60)) /
                    (1000 * 60)
                );

            const seconds =
                Math.floor(
                    (difference %
                    (1000 * 60)) /
                    1000
                );


            right.innerHTML = `

                <div class="time-box">

                    <div class="number">
                        ${String(days).padStart(2,"0")}
                    </div>

                    <div class="label">
                        రోజులు
                    </div>

                </div>


                <div class="time-box">

                    <div class="number">
                        ${String(hours).padStart(2,"0")}
                    </div>

                    <div class="label">
                        గంటలు
                    </div>

                </div>


                <div class="time-box">

                    <div class="number">
                        ${String(minutes).padStart(2,"0")}
                    </div>

                    <div class="label">
                        నిమిషాలు
                    </div>

                </div>


                <div class="time-box">

                    <div class="number">
                        ${String(seconds).padStart(2,"0")}
                    </div>

                    <div class="label">
                        సెకన్లు
                    </div>

                </div>

            `;

        }


        card.appendChild(left);
        card.appendChild(right);


        return card;

    }


    /*
    ==========================================
    FORMAT DATE IN TELUGU
    ==========================================
    */

    function formatDate(dateString) {

        const date = new Date(
            dateString + "T00:00:00+05:30"
        );


        const months = [

            "జనవరి",
            "ఫిబ్రవరి",
            "మార్చి",
            "ఏప్రిల్",
            "మే",
            "జూన్",
            "జూలై",
            "ఆగస్టు",
            "సెప్టెంబర్",
            "అక్టోబర్",
            "నవంబర్",
            "డిసెంబర్"

        ];


        return `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;

    }


    /*
    ==========================================
    UPDATE FESTIVALS
    ==========================================
    */

    function updateFestivals() {

        const now = new Date().getTime();


        const festivalData = festivals.map(festival => {

            const festivalTime =
                new Date(
                    festival.date +
                    "T00:00:00+05:30"
                ).getTime();


            return {

                ...festival,

                time: festivalTime,

                difference:
                    festivalTime - now

            };

        });


        /*
        Sort:
        Upcoming festivals first
        */

        festivalData.sort(
            (a, b) => a.time - b.time
        );


        const list =
            document.getElementById(
                "festivalList"
            );


        list.innerHTML = "";


        festivalData.forEach(festival => {

            const card =
                createFestivalCard(
                    festival,
                    festival.difference
                );


            list.appendChild(card);

        });

    }


    /*
    ==========================================
    START
    ==========================================
    */

    updateFestivals();


    /*
    Update every second
    */

    setInterval(
        updateFestivals,
        1000
    );

</script>

</body>
</html>
