<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>పండుగ - సన్నివేశం | Sannivesham</title>
  <meta name="description" content="భారతీయ పండుగలు, వ్రతాలు, పూజా విధానాలు మరియు వాటి విశిష్టత - సన్నివేశం.">
  <script src="../theme.js"></script>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="festivals.css">
  <link rel="stylesheet" href="../library/library.css">
</head>
<body class="festival-detail-body theme-night">

  <div id="readingProgressBar"></div>
  <div class="festivals-bg"></div>

  <!-- STICKY READER TOOLBAR -->
  <header class="reader-toolbar" id="readerToolbar">
    <div class="reader-nav-left">
      <a href="festivals.html" class="reader-back-btn">← పండుగలు</a>
      <span class="reader-breadcrumb" id="festivalBreadcrumb">సన్నివేశం పండుగలు</span>
    </div>

    <div class="reader-actions">
      <button class="reader-btn" id="fontMinusBtn" title="అక్షరాల సైజు తగ్గించండి">A-</button>
      <span id="fontSizeDisplay" style="font-size:0.85rem;color:#ffd166;font-weight:600;min-width:32px;text-align:center;">21px</span>
      <button class="reader-btn" id="fontPlusBtn" title="అక్షరాల సైజు పెంచండి">A+</button>
      <button class="reader-btn" id="themeCycleBtn" title="థీమ్ మార్చండి">🎨 థీమ్</button>
      <button class="reader-btn" id="copyContentBtn" title="వివరణ కాపీ చేయండి">📋 కాపీ</button>
      <button class="reader-btn" id="shareWhatsAppBtn" title="వాట్సాప్‌లో షేర్ చేయండి">📲 షేర్</button>
      <button class="reader-btn" id="focusModeBtn" title="ధ్యాన వీక్షణ (Focus Mode)">🧘 ధ్యానం</button>
    </div>
  </header>

  <!-- MAIN ARTICLE READER CONTAINER -->
  <main class="reader-container">
    <article class="reader-card" id="festivalDetailCard">
      <header class="reader-header">
        <span class="reader-om">ॐ</span>
        <h1 class="reader-title" id="festivalTitle">లోడ్ అవుతోంది...</h1>
        <div class="reader-subtitle" id="festivalSubtitle">పండుగ విశేషాలు లోడ్ చేయబడుతున్నాయి...</div>
      </header>

      <div class="reader-verses" id="festivalDetailBox"></div>

      <div class="reader-ornament" id="festivalOrnament" style="display:none;">
        ✦ మంగళం దివ్య మంగళం ✦
      </div>
    </article>
  </main>

  <footer class="simple-footer">
    <p class="footer-quote" id="festivalFooterQuote">
      ✨ మన పండుగలు మన సంస్కృతి ప్రతిబింబం ✨
    </p>
    <script type="module" src="../social-links.js"></script>
    <p>© 2026 సన్నివేశం</p>
  </footer>

  <script type="module" src="festival-detail.js"></script>
  <script src="../script.js"></script>
  <audio id="bgMusic" loop>
    <source src="../music/traditional.mp3" type="audio/mpeg">
  </audio>
  <button id="musicBtn" class="music-btn" title="సంగీతం">🔊</button>
  <script src="../music.js"></script>
</body>
</html>
