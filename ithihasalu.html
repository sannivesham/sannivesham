<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ఇతిహాసాలు - సన్నివేశం</title>
  <link rel="stylesheet" href="style.css">
  <style>
  .stories-title-box {
    margin-bottom: 20px;
  }

  #ithihasaluGrid {
    margin-top: 0;
  }
</style>
</head>
<body class="stories-body">

  <div class="stories-bg"></div>

  <div id="loader">
    <div class="loader-content">
      <img src="images/logo.png" class="loader-logo" alt="Sannivesham Logo">
      <h1>సన్నివేశం</h1>
      <div class="loader-line"></div>
    </div>
  </div>

  <nav class="glass-navbar">
    <a href="index.html#categories">← వెనుకకు</a>
    <a href="index.html">ప్రారంభం</a>
    <a href="ithihasalu.html">ఇతిహాసాలు</a>
  </nav>

  <section class="stories-page">
    <div class="stories-title-box">
      <h1>📜 ఇతిహాసాలు</h1>
      <p>రామాయణం, మహాభారతం మరియు ఇతర పవిత్ర గ్రంథాలు</p>
    </div>
    <div class="stories-grid" id="ithihasaluGrid"></div>
  </section>

  <footer class="simple-footer">
    <p class="footer-quote">✨ ఇతిహాసాలు మన జాతి గర్వం ✨</p>
    <script type="module" src="social-links.js"></script>
    <p>© 2026 సన్నివేశం</p>
  </footer>


  <script type="module">
    import { db } from "./firebase-config.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
    async function loadStoriesBackground() {
        const snap = await getDoc(doc(db, "settings", "backgrounds"));
        if (!snap.exists()) return;
        const data = snap.data();
        const bg = document.querySelector(".stories-bg");
        if (window.innerWidth <= 700 && data.storiesMobile) {
            bg.style.backgroundImage =
                `linear-gradient(rgba(15,8,3,0.50), rgba(15,8,3,0.50)), url("${data.storiesMobile}")`;
        } else if (data.storiesPc) {
            bg.style.backgroundImage =
                `linear-gradient(rgba(15,8,3,0.60), rgba(15,8,3,0.60)), url("${data.storiesPc}")`;
        }
    }
    loadStoriesBackground();
</script>

  
  <script src="script.js"></script>
  <script type="module" src="ithihasalu.js"></script>
  <audio id="bgMusic" loop>
    <source src="music/traditional.mp3" type="audio/mpeg">
  </audio>
  <button id="musicBtn" class="music-btn">🔊</button>
  <script src="music.js"></script>

</body>
</html>
